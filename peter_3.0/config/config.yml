# Peter 3.0 — configuration
#
# Everything that is NOT a secret lives here, and this file is committed to git.
# Secrets (API keys, passwords, OAuth client secrets) live in .env, which is not.
#
# Any value here can be overridden by an environment variable using the path
# with double underscores, e.g.
#     PETER__AGENT__MODEL=claude-sonnet-5
#     PETER__APP__LOG_LEVEL=DEBUG
# which is how you change one setting for one run without editing this file.

app:
  user_name: Dhusnic
  assistant_name: Peter
  data_dir: ./data
  log_level: ERROR         # DEBUG | INFO | WARNING | ERROR | CRITICAL
  log_format: rich          # rich | json  (json for shipping logs somewhere)

agent:
  # Which vendor answers. Switchable by voice at runtime ("switch to Gemini"),
  # for one run with --provider gemini or PETER__AGENT__PROVIDER=gemini, or
  # permanently by changing this line. Only matters if that vendor's key is
  # actually set in .env — check `python -m peter.main --health`.
  provider: gemini           # anthropic | openai | gemini

  # One model per vendor, so switching provider does not need a second edit.
  # To change which model a vendor uses, just edit its line below — pick from
  # the options in that provider's comment. Prices are $/Mtok, input / output.
  models:
    # anthropic (Claude) — https://docs.anthropic.com/en/docs/about-claude/models
    #   claude-opus-5    5.00 / 25.00  smartest, best for hard reasoning/agentic work
    #   claude-sonnet-5  3.00 / 15.00  strong default, good cost/quality balance
    #   claude-haiku-4-5 1.00 / 5.00   fastest+cheapest Claude, simple/routine turns
    #   claude-fable-5   5.00 / 25.00  Opus-tier, tuned for creative/long-form writing
    anthropic: claude-opus-5

    # openai (GPT) — https://platform.openai.com/docs/models
    #   gpt-5.6-sol      5.00 / 30.00  top-tier reasoning, most expensive
    #   gpt-5.6-terra    2.00 / 12.00  solid mid-tier default
    #   gpt-5.6-luna     0.20 / 1.20   cheapest, best for simple/high-volume turns
    openai: gpt-5.6-terra

    # gemini (Google) — prices verified against ai.google.dev/gemini-api/docs/pricing
    #   auto                    --          smart per-turn routing between the
    #                                        rows below — see gemini_auto just
    #                                        underneath. Cheap model for routine
    #                                        turns, the strong one only when
    #                                        the turn actually needs it.
    #   gemini-3.1-pro-preview  2.00 / 12.00  strongest Gemini, best reasoning
    #   gemini-3.7-flash        0.75 / 3.75   latest flash, fast + cheap, good default
    #   gemini-3.6-flash        0.75 / 3.75   same price as 3.7, one generation back
    #   gemini-3.5-flash        1.50 / 9.00   older flash generation, no longer cheapest
    gemini: auto

  # Only read when models.gemini above is "auto". Peter classifies each turn's
  # own text — free, instant, no extra API call — and picks light_model for a
  # routine lookup or heavy_model for something that actually needs deeper
  # reasoning (keywords like "explain"/"compare"/"debug"...), a high-stakes
  # action (delete/buy/pay/powershell...), or a request longer than the word
  # threshold. See peter/llm/router.py for the exact rules. Gemini-only for
  # now — Claude and GPT do not have this large a price gap within one family.
  gemini_auto:
    light_model: gemini-3.7-flash
    heavy_model: gemini-3.1-pro-preview
    heavy_word_threshold: 40

  # When a Gemini model returns a recoverable error (rate limit, momentary
  # 503) these same-tier substitutes are tried immediately, with no delay,
  # before the exponential backoff below ever kicks in — a fast hedge against
  # one model being briefly overloaded, tried in order, remembering whichever
  # one last worked so later turns do not keep re-probing a model still down.
  # Kept to the same price tier deliberately: this is a hedge against an
  # outage, not licence to spend more per token.
  gemini_fallbacks:
    gemini-3.7-flash: [gemini-3.6-flash, gemini-3.5-flash]

  # Explicit server-side caching of the prompt prefix (Gemini only).
  # The system prompt plus every tool schema is re-sent on every API call and
  # is ~98% of what Peter spends. Cached, it bills at a tenth of list price —
  # measured 99.96% coverage from the first call, versus ~50% (after two cold
  # calls) from Gemini's automatic implicit caching.
  # Storage is billed per hour, so the cache is created on first use, its TTL
  # is pushed out while you keep talking, and it is deleted at shutdown rather
  # than held around the clock.
  cache:
    enabled: true
    ttl_seconds: 900        # refreshed on each use; lapses when idle
    # Gemini will not cache a prefix below 4,096 tokens. Trimming the prompt
    # or tool list under this floor DISABLES caching and costs more, not less.
    min_tokens: 4096

  # What happens when the active provider fails for a transient reason (rate
  # limit, momentary outage, dropped connection) — anything the provider
  # itself marks recoverable. Peter retries with exponential backoff + jitter,
  # announcing each attempt in text/voice, and only surfaces the real error
  # after the last one fails. A wrong API key or a non-transient error is
  # never retried — no number of attempts fixes a bad key.
  retry:
    max_attempts: 5             # total tries, including the first
    base_delay_seconds: 10      # delay before retry 1; roughly doubles each time
    max_delay_seconds: 60       # delay never grows past this

  # Every vendor bills in USD; the spoken/CLI usage summary is shown in INR.
  # No live FX feed — this is a manually maintained rate, update it here
  # occasionally rather than trusting it to stay exact.
  usd_to_inr_rate: 88.0

  # Looking at images: the screen, a browser page, a file on disk. One
  # isolated call per image - never part of the conversation history, so a
  # screenshot is not re-sent on every later turn of the same conversation.
  vision:
    enabled: true
    # Empty means "use agent.provider / its model above". Every current model
    # from all three vendors reads images, so pinning one is rarely needed.
    provider: ""
    model: ""
    # Screens are wide. A 3840px grab costs several times a 1600px one and
    # reads no better - text stays legible well below native resolution.
    max_width: 1600
    jpeg_quality: 80
    max_tokens: 1200

  # Parallel fan-out for reading several pages at once (compare_across_sites).
  # Pages are fetched one at a time - there is one browser, and the per-domain
  # spacing is deliberate - but each page is then read by its own small,
  # isolated model call, so only short findings reach the conversation instead
  # of five pages of raw text.
  subagent:
    enabled: true
    # Empty means the configured provider/model. A cheaper model is usually
    # right here: the subagent's job is extraction, not reasoning.
    provider: ""
    model: ""
    max_sites: 5
    max_chars_per_site: 4000
    max_workers: 4

  # A daily spend ceiling, in rupees. 0 disables it, which is the default -
  # a budget that trips mid-sentence is worse than no budget until you have
  # looked at a week of real numbers (spend_report) and picked one on purpose.
  #   warn   say something once, then carry on
  #   block  refuse further turns until midnight
  # There is deliberately no "drop to the cheap model" option: Gemini's `auto`
  # routing already picks a model per turn and overwrites it on every call, so
  # a budget-imposed downgrade would silently not apply on the very setup most
  # likely to want it.
  budget:
    daily_inr: 0
    action: warn

  # Model used for cheap/routine background turns regardless of active
  # provider (e.g. summarizing, quick lookups) — always Claude's cheapest,
  # independent of `provider` above.
  fast_model: claude-haiku-4-5
  effort: low               # low | medium | high | xhigh | max
  max_tokens: 8000
  # Turns kept in the rolling context window before the oldest are dropped.
  max_history_messages: 40
  # Cap on resuming a turn that a server-side tool paused.
  max_pause_restarts: 5
  # Prompt cache lifetime for the system prefix.
  cache_ttl: 1h
  enable_web_tools: true

voice:
  wake:
    # A built-in openWakeWord model (alexa, hey_mycroft, hey_jarvis,
    # hey_rhasspy) or an absolute path to a custom-trained .onnx file.
    # There is no built-in "Peter" model — see the README.
    model: hey_jarvis
    threshold: 0.5
    # Frames ignored after a detection, so one utterance fires once.
    refractory_frames: 25

  stt:
    model: small.en         # tiny.en | base.en | small.en | medium.en | large-v3
    device: cpu             # cpu | cuda
    compute_type: int8      # int8 on cpu, float16 on cuda
    # Endpointing: how long a pause has to be before Peter decides you finished.
    silence_to_end: 0.8
    max_utterance: 20.0
    max_lead_in: 6.0
    min_speech: 0.3
    # Speech must exceed the measured room noise floor by this factor.
    noise_margin: 3.0
    min_threshold: 0.006

  tts:
    engine: piper           # piper (local) | edge (online) | sapi (windows)
    # Path to a Piper .onnx voice. Download from:
    #   https://huggingface.co/rhasspy/piper-voices
    piper_voice: ./data/voices/en_US-lessac-medium.onnx
    edge_voice: en-IN-PrabhatNeural
    sapi_rate: 185

  audio:
    # null means the system default. Run `python -m peter.main --devices`.
    input_device: null
    output_device: null

policy:
  # tier -> what happens when a tool of that tier is called
  #   allow   run it
  #   confirm ask first; a refusal returns to Claude as a normal tool result
  #   handoff never run; hand back to the human (money)
  #   deny    never run
  #
  # `write` defaults to allow: most write-tier tools (opening an app, playing
  # a video, creating a calendar event, updating a memory) are cheap and
  # reversible, and a y/N prompt on every one of them is just friction. Only
  # the handful of genuinely high-consequence tools below are pulled back to
  # confirm — the ones that destroy data, run arbitrary commands, or send
  # something to another person that can't be unsent. `spend` still never
  # even reaches a prompt; it always hands off to you.
  default_tiers:
    read: allow
    write: allow
    spend: handoff

  confirm_timeout_seconds: 45

  # Per-tool overrides. These beat the tier default.
  standing_rules:
    # Destructive, irreversible, or high blast-radius. Do not relax without
    # understanding the cost.
    delete_file: confirm
    delete_email: confirm
    delete_calendar_event: confirm
    run_powershell: confirm
    lock_workstation: confirm
    send_email: confirm
    # Connects immediately, no on-device confirmation screen — unlike every
    # other phone tool, which either only reads or is trivially reversible.
    make_phone_call: confirm

integrations:
  # Controlling software already installed on this machine: your own browser,
  # bookmarks, media playback, local folders. Distinct from `browser:` further
  # down, which is Playwright driving a scripted session Peter owns — this is
  # your browser, opened for you to look at.
  desktop:
    enabled: true

    # Which browser links open in. "default" follows the Windows setting.
    # Detected automatically: firefox, chrome, edge, brave.
    preferred_browser: firefox
    # Named profile, if you keep more than one. Firefox wants the profile
    # NAME; Chromium wants the directory ("Default", "Profile 1").
    browser_profile: ""

    # YouTube (play_youtube, and "open youtube") opens here instead, so video
    # doesn't pile up in the browser you use for everything else. Empty
    # string means no override — falls back to preferred_browser above.
    youtube_browser: brave
    youtube_browser_profile: ""

    # Gmail addresses accounts positionally (mail.google.com/mail/u/<n>), so
    # this maps what you say onto that index. A full email address also works
    # and survives the order changing.
    #   "open my work mail" -> u/1
    gmail_accounts: {}
    #   personal: "0"
    #   work: "1"

    # Named shortcuts for sites. These override the built-in names (gmail,
    # youtube, drive, calendar, maps, github, whatsapp).
    sites: {}
    #   jira: https://your-company.atlassian.net

    # Extra folders openable by name, on top of the standard Windows ones
    # (desktop, documents, downloads, pictures, videos, music, home).
    places:
      peter project: D:/Peter-AI-Voice-Assistance

    # Whose bookmarks to search. Empty means every installed browser.
    bookmark_sources: []

  mail:
    enabled: true
    # IMAP is used instead of the Gmail API on purpose: Gmail API scopes are
    # "restricted", which forces a 7-day refresh-token expiry on personal
    # projects. An app password has no expiry. See README.
    imap_host: imap.gmail.com
    imap_port: 993
    smtp_host: smtp.gmail.com
    smtp_port: 587
    inbox_folder: INBOX
    archive_folder: "[Gmail]/All Mail"
    trash_folder: "[Gmail]/Trash"
    # Cap on messages fetched per request, and characters of body kept.
    fetch_limit: 25
    body_chars: 4000
    timeout_seconds: 30

  google:
    enabled: true
    # Calendar and Tasks scopes are "sensitive", not "restricted" — they do not
    # need the security audit Gmail would. Set the consent screen to
    # "In Production" to escape the 7-day token expiry. See README.
    scopes:
      - https://www.googleapis.com/auth/calendar
      - https://www.googleapis.com/auth/tasks
    calendar_id: primary
    tasklist_id: "@default"
    oauth_port: 0             # 0 = pick any free port
    timeout_seconds: 30

  browser:
    enabled: true
    # Which browser Playwright drives for browse_page, check_price,
    # browser_login and the rest — always a separate, Peter-owned instance
    # with its own profile below, never your actual installed browser and
    # unrelated to desktop.preferred_browser above.
    #   chromium   default. Best-tested against anti-bot detection.
    #   firefox    Playwright's own bundled Firefox, not your system one.
    # Run `python -m playwright install firefox` once before switching to it.
    # Changing this needs a fresh profile_dir — delete the folder below first,
    # the two engines' profile formats do not carry over.
    engine: firefox
    # Headed on purpose. You can see what it is doing and stop it, and a
    # headless browser is the loudest automation signal there is.
    headless: false
    profile_dir: ./data/browser_profile
    default_timeout_seconds: 30
    # Minimum seconds between requests to the SAME domain. This is the single
    # most effective measure against getting an account flagged — far more than
    # any fingerprint trick. Do not lower it to speed up price checks.
    min_interval_seconds: 20
    max_page_chars: 6000
    # Sites Peter may open at all. Empty list = no restriction. Filling this in
    # is the cheapest way to bound the blast radius of a misread instruction.
    allowed_domains: []

  briefing:
    enabled: true
    # Daily spoken summary. Set enabled: false to turn it off entirely.
    time: "07:30"
    include:
      - calendar
      - mail
      - reminders
      - todos
    max_emails: 5
    max_events: 6

  # Unprompted heads-up shortly before a calendar event: what it is, who's
  # on it, and — if anything relevant was ever said in a past conversation —
  # a one-line reminder of it. Polls the calendar rather than pre-scheduling
  # per event, so a moved or cancelled meeting is picked up automatically.
  meeting_prep:
    enabled: true
    lead_minutes: 10           # how long before the event to speak up
    poll_interval_minutes: 5   # keep <= lead_minutes or a short gap can hide an event

  # Periodic "does anything in my inbox actually need me" scan. Read-only —
  # this only ever reports; it never drafts or sends a reply. Classification
  # is one small model call against sender/subject lines only (not bodies),
  # using whichever provider is configured above.
  inbox_digest:
    enabled: true
    poll_interval_minutes: 60
    max_emails: 15

  # ------------------------------------------------------------------ reach
  # Talking to Peter, and being reached by Peter, away from the desk. This is
  # the multiplier on every proactive feature here: a tray toast only exists
  # if you are sitting in front of the machine, a Telegram message finds you.
  #
  # Setup:
  #   1. Message @BotFather on Telegram, send /newbot, follow the prompts
  #   2. Put the token it gives you in .env as TELEGRAM_BOT_TOKEN
  #   3. Run: python -m peter.main --telegram-setup
  #   4. Paste the chat id it prints into allowed_chat_ids below
  telegram:
    enabled: true
    # Chat ids allowed to talk to Peter. AN EMPTY LIST MEANS NOBODY, which is
    # the only safe default: a bot token is a public endpoint and anyone who
    # guesses the bot name can message it. An unknown chat gets no reply at
    # all - not even a refusal, which would confirm the bot exists.
    allowed_chat_ids:
      - 1207981900
    #  - 123456789
    # Seconds the getUpdates long poll is held open (Telegram allows up to 50).
    # This is ONE held HTTP request, not repeated polling, so a longer value is
    # both cheaper and more responsive.
    long_poll_seconds: 25
    # Mirror proactive announcements - reminders, meeting prep, the inbox
    # digest, finished focus sessions, price alerts, CI failures - to the same
    # chats.
    forward_notifications: true
    max_message_chars: 3800
    timeout_seconds: 40

  # --------------------------------------------------------------- watching
  # Standing price and stock watches on product pages ("tell me when this gets
  # cheaper"). Uses the same structured-data extraction as check_price, and the
  # same per-domain rate limit, so a sweep of several watches on one site takes
  # minutes by design. That spacing is what keeps the account un-flagged; the
  # fix for a slow sweep is fewer watches, not a shorter gap.
  price_watch:
    enabled: true
    poll_interval_minutes: 90
    max_watches: 20
    # Announce a fall of at least this percent even with no target set. Raise
    # it if the alerts start feeling like noise.
    drop_percent: 5
    alert_on_restock: true

  # -------------------------------------------------------------- recording
  # Meeting capture, transcribed locally with faster-whisper (the same engine
  # the wake word uses). The audio never leaves this machine; only the final
  # summary is a model call, and it goes over text, not audio.
  recorder:
    enabled: true
    # Capture what the speakers are playing - i.e. the other people on the
    # call - via WASAPI loopback, falling back to the microphone when the
    # installed sounddevice build cannot do it. Check which you get with the
    # audio_sources tool.
    capture_system_audio: true
    sample_rate: 16000
    max_minutes: 180
    # Transcription happens in the background, so a slower and more accurate
    # model is affordable here in a way it is not for a live voice turn.
    stt_model: small.en
    # Start recording automatically when a meeting-prep nudge fires. OFF by
    # default and deliberately so: recording a conversation without deciding
    # to is not a default anyone should inherit silently.
    auto_record_meetings: false

  # -------------------------------------------------------------------- dev
  # Git, pull requests and CI. Read-only: there is no commit, push, merge or
  # checkout tool, on purpose. With no repos configured the whole tool group is
  # skipped, so it costs nothing.
  dev:
    enabled: true
    # Spoken name -> path on disk. The first is the default when none is named.
    repos: {
      peter: D:/Peter-AI-Voice-Assistance,
      Trading_suggestion_Botq: D:/Trading_suggestion_Bot,
      other project: "D:/Code for tutorials"
    }
    #   peter: D:/Peter-AI-Voice-Assistance
    # Restrict "my commits" to this author. Empty means the repo's own
    # configured user.email.
    git_author: ""
    git_timeout_seconds: 20
    # The GitHub CLI carries its own auth (`gh auth login`), so Peter never
    # handles a GitHub token. Install it from cli.github.com.
    gh_path: gh
    gh_timeout_seconds: 30
    # Announce a build that failed, once per run. The first sweep after start
    # only records what is already failing without shouting about history.
    ci_watch:
      enabled: true
      poll_interval_minutes: 10
      branches: []          # empty = every branch gh reports on
      runs_per_repo: 10

  # ---------------------------------------------------------------- worklog
  # End-of-day record of what actually happened: commits, meetings, focus
  # sessions, finished to-dos. Written into memory as an episode, so "what was
  # I doing last Tuesday" survives long after that conversation is gone. Also
  # backs the standup_notes tool.
  worklog:
    enabled: true
    time: "18:30"
    days_back: 1

  # ------------------------------------------------------------- waiting on
  # Mail you sent that nobody answered - the thing that actually falls through
  # the cracks, because nothing in a mail client shows you an absence.
  # Read-only: it never nudges anyone and never drafts a follow-up.
  waiting_on:
    enabled: true
    quiet_days: 3         # how long unanswered before it counts
    lookback_days: 21     # how far back in Sent to look at all
    max_messages: 40

  # -------------------------------------------------------------- workspace
  # Saving and restoring a set of open applications ("save this as my migration
  # setup"). Only windows you can actually see are captured.
  workspace:
    enabled: true
    max_apps: 25
    # Never captured or relaunched, matched on filename. python.exe is on this
    # list because restoring it would relaunch Peter itself.
    ignore_executables:
      - explorer.exe
      - searchhost.exe
      - shellexperiencehost.exe
      - textinputhost.exe
      - applicationframehost.exe
      - systemsettings.exe
      - startmenuexperiencehost.exe
      - widgets.exe
      - lockapp.exe
      - python.exe
      - pythonw.exe
      - cmd.exe
      - conhost.exe

  # ------------------------------------------------------------------ phone
  # Reading SMS over ADB - mainly for one-time codes, since Peter can walk a
  # checkout up to the payment screen but cannot legally complete it.
  # OFF by default: it needs USB debugging on and this machine authorised on
  # the handset, which is a deliberate act. Read-only; Peter never sends a
  # message as you.
  phone:
    enabled: true
    # adb_path can be just "adb" if it is on the PATH, or a full path to
    # adb.exe. Peter does not ship adb itself, so you must install it —
    # here it is unzipped straight into the repo rather than added to PATH,
    # which is why this points at it directly. That folder is gitignored
    # (mobile dev/) since it is a downloaded binary, not project source.
    adb_path: "./mobile dev/platform-tools-latest-windows/platform-tools/adb.exe"
    device_serial: ""        # required only when several devices are attached
    sms_limit: 10
    otp_window_minutes: 10
    timeout_seconds: 20
    # Folders save_phone_screenshot checks, in order, for the newest file.
    pull_dirs:
      - "/sdcard/Pictures/Screenshots"
      - "/sdcard/DCIM/Screenshots"
    spotify_package: "com.spotify.music"
    # "<ip>:<port>" for ADB over Wi-Fi, once paired — Settings -> Developer
    # options -> Wireless debugging -> pair, then the address it shows on
    # the main Wireless debugging screen (a different one than the pairing
    # screen). Empty means USB-only. With this set, every phone command
    # retries once through `adb connect` if the device turns out to be
    # disconnected, instead of failing until you re-run `adb connect` by
    # hand — a wireless session doesn't survive the phone leaving Wi-Fi, a
    # reboot, or wireless debugging being toggled off and on.
    wireless_address: ""

  # ------------------------------------------------------------------- docs
  # Full-text search over folders you point Peter at, and answers built from
  # them with citations. Lives in its own database (data/docs.db) so it can be
  # deleted and rebuilt without touching memory.
  docs:
    enabled: true
    # Indexed on startup, in the background. Indexing is incremental - an
    # unchanged file is skipped without being read.
    folders: []
    #   - D:/notes
    extensions:
      - .md
      - .txt
      - .rst
      - .py
      - .js
      - .ts
      - .java
      - .go
      - .sql
      - .yml
      - .yaml
      - .json
      - .toml
      - .ini
      - .cfg
    max_file_kb: 512        # above this is almost always generated output
    chunk_chars: 1200
    max_files: 5000
    skip_directories:
      - .git
      - .venv
      - venv
      - node_modules
      - __pycache__
      - dist
      - build
      - .mypy_cache
      - .pytest_cache
      - .idea
      - .vscode
